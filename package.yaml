name:                ngram-generator
version:             0.1.0.0
github:              "Sahaswari/text_generation_with_N_gram_language_model"
license:             MIT
author:              "Your Team"
maintainer:          "your-email@example.com"
copyright:           "2024 Your Team"

extra-source-files:
- README.md

description:         N-Gram Language Model for Text Generation

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  dependencies:
    - "base >= 4.7 && < 5"
    - "containers >= 0.6"
    - "random >= 1.2"
    - "time >= 1.12"
    - "directory >= 1.3"
  exposed-modules:
  - DataTypes
  - DataPreprocessing
  - Processing
  - Utils
  - IOHandler

executables:
  ngram-generator-exe:
    main:                Main.hs
    source-dirs:         src
    dependencies:
      - ngram-generator
      - base >= 4.7 && < 5
      - containers >= 0.6
      - random >= 1.2
      - time >= 1.12
      - directory >= 1.3
      - ngram-generator
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    
